[project]
name = "sage"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Ricky-790" }]
requires-python = ">=3.13"
dependencies = [
    "dotenv>=0.9.9",
    "langchain>=1.4.7",
    "langchain-google-genai>=4.4.2",
    "langchain-openrouter>=0.2.9",
    "pytest>=9.2.0",
]

[project.scripts]
sage = "sage:main"

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "langchain-google-genai>=4.4.2",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.3.1",
]
